apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-clusterip-port

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-port

  template:
    metadata:
      labels:
        app: nginx-port

    spec:
      containers:
      - name: nginx
        image: nginx:1.25

        ports:
        - containerPort: 80
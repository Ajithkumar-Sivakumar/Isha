apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-multi-port

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-multi

  template:
    metadata:
      labels:
        app: nginx-multi

    spec:
      containers:
      - name: nginx
        image: nginx:1.25

        ports:
        - containerPort: 80
        - containerPort: 443
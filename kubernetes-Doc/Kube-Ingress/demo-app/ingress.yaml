apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phone-demo-ingress
  namespace: phone-demo
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: phone-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phone-demo-service
                port:
                  number: 80

apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: fluentd

spec:

  selector:
    matchLabels:
      app: fluentd

  template:

    metadata:
      labels:
        app: fluentd

    spec:

      containers:

      - name: fluentd

        image: fluent/fluentd:v1.16

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        volumeMounts:

        - name: varlog
          mountPath: /var/log

      volumes:

      - name: varlog

        hostPath:
          path: /var/log